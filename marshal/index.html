<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Marshal - Dashboard SHR 2026</title>
  
  <!-- SweetAlert2 untuk Pop-up Password -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #iframeContainer { width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Tempat iframe akan dimunculkan jika password benar -->
  <div id="iframeContainer"></div>

  <script>
    const GAS_LAPORAN_URL = "https://script.google.com/macros/s/AKfycbyuQqDLOiZmNy6KNQ_xH-mHc8HJfMc5uyJsis1c93Na61qHHjqxQV-96RPaMbSfmkaZ/exec";
    const KATA_SANDI_BENAR = "SHR2026"; // Ganti password sesuai keinginan

    // Langsung munculkan pop-up saat halaman dimuat
    window.onload = function() {
      askPassword();
    };

    function askPassword() {
      Swal.fire({
        title: 'Akses Khusus Panitia',
        text: 'Masukkan Kata Sandi untuk membuka Dashboard',
        input: 'password',
        inputPlaceholder: 'Kata Sandi...',
        inputAttributes: {
          autocapitalize: 'off',
          autocorrect: 'off'
        },
        background: '#1e1e1e',
        color: '#e0e0e0',
        confirmButtonColor: '#1f4037',
        confirmButtonText: 'Buka Dashboard',
        allowOutsideClick: false,
        allowEscapeKey: false,
        preConfirm: (password) => {
          if (!password || password !== KATA_SANDI_BENAR) {
            Swal.showValidationMessage('Kata sandi salah!');
          }
          return password;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          // Jika sandi benar, render iframe ke dalam container
          document.getElementById('iframeContainer').innerHTML = `<iframe src="${GAS_LAPORAN_URL}"></iframe>`;
          
          Swal.fire({
            title: 'Akses Diberikan',
            icon: 'success',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            background: '#1e1e1e',
            color: '#99f2c8'
          });
        }
      });
    }
  </script>
</body>
</html>
